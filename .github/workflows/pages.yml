# Builds the docs site, gallery and shadcn registry as static files and
# publishes them to GitHub Pages on every merge to main. The registry is served
# under /r of the same site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:build
      - name: Registry matches registry.json
        # Fails on changed and on new untracked files, so a missing item shows up too.
        run: |
          changes="$(git status --porcelain -- apps/docs/public/r apps/docs/registry.json)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- apps/docs/public/r apps/docs/registry.json
            exit 1
          fi
      # next.config.ts sets output: "export", so the build writes apps/docs/out.
      - run: pnpm turbo run build --filter docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
